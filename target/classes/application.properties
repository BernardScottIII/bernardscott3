spring.application.name=bernardscott3

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bernardscott3}
spring.datasource.username=${DATABASE_USERNAME:bernard}
spring.datasource.password=${DATABASE_PASSWORD:your-development-password}
spring.jpa.hibernate.ddl-auto=update

spring.mail.host=${MAIL_HOST:smtp.mail.me.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

contact.recipient=${CONTACT_RECIPIENT:}
contact.from=${CONTACT_FROM:${MAIL_USERNAME:}}
contact.turnstile-site-key=${TURNSTILE_SITE_KEY:}
contact.turnstile-secret=${TURNSTILE_SECRET_KEY:}
